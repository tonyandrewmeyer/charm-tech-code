# Routine version-update sweeps only. CVE patches are raised by the
# repo-level "Dependabot security updates" toggle (managed in
# canonical-repo-automation: features.dependabot_security_updates = true),
# which is event-driven and does not honour the schedule below.
version: 2

updates:
  # ===================================================================
  # GitHub Actions: routine lane (monthly, single grouped PR)
  # ===================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 100
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # ===================================================================
  # Python (uv): routine lane (monthly, grouped along three seams)
  # ===================================================================
  # One lockfile per package plus the root one (which holds the shared lint
  # tooling). Add a directory here when you add a package.
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/ai-failure-notifier"
      - "/changelog"
      - "/draft-release-notes"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 100
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # Linters and other dev tooling. Majors ride along; a major bump is
      # low-risk to review in a batch.
      dev-tooling:
        patterns:
          - "ruff"
          - "zizmor"
      # Test runner + other shared test deps.
      test-deps:
        patterns:
          - "pytest"
          - "pytest-*"
      # Everything else, minor + patch only. A runtime MAJOR falls through
      # to its own ungrouped PR so it never silently rides a patch bundle.
      runtime:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

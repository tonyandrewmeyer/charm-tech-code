name: Workflow static checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Upload the SARIF results as code-scanning alerts.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Run zizmor
        run: uvx zizmor@v1.32.0 --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: results.sarif
          category: zizmor

      # SARIF output always exits 0, so without this step the check passes
      # whatever zizmor finds. Run it again in the normal format so that a
      # finding fails the job, after the upload so the alerts still appear.
      - name: Fail on findings
        run: uvx zizmor@v1.32.0 .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

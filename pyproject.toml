# Root of the monorepo. This is not itself a package -- each tool lives in its
# own top-level directory with its own pyproject.toml, src/ and tests/, the
# same shape canonical/charmlibs uses.
#
# What lives here is the configuration every tool should share, so that code
# moving between this repo and the repos it is used by does not change style
# on the way.

[project]
name = "charm-tech-code-monorepo"
version = "0.0.0-dev0"
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
lint = [
    # Pinned to the version canonical/operator pins, since that is where this
    # code is used and where it came from.
    "ruff==0.15.20",
]

# Ruff configuration, copied from canonical/operator so that a file can move
# between the two without being reformatted. `preview` is set here rather than
# passed as `--preview` on the command line (which is how operator's tox does
# it) so that an editor, a pre-commit hook and CI all agree without anyone
# having to remember the flag. It is load-bearing, not cosmetic: the preview
# style hugs brackets inside calls, and without it every such call in
# ai-failure-notifier reformats.
[tool.ruff]
line-length = 99
target-version = "py310"
preview = true

[tool.ruff.format]
quote-style = "single"

# The rule set the team agreed on: canonical/charm-tech `style/python.md`,
# "Tooling configuration". It lives here so that every tool in the monorepo
# gets it, the same way the line length and the quote style do.
[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pep8-naming
    "N",
    # flake8-builtins
    "A",
    # flake8-copyright
    "CPY",
    # pyupgrade
    "UP",
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # ruff-specific
    "RUF",
    # perflint
    "PERF",
    # pydocstyle
    "D",
    # flake8-future-annotations
    "FA",
    # flake8-type-checking
    "TC",
]
# Named rather than coded, as operator's list is, so that a reader can see
# what is off without looking anything up. Selecting by name needs `preview`,
# which is set above. `select` above cannot do the same: a whole linter has no
# name ruff accepts, only its prefix.
ignore = [
    # Imports used only in annotations do not have to move into a
    # `TYPE_CHECKING` block.
    "typing-only-first-party-import",  # TC001
    "typing-only-third-party-import",  # TC002
    "typing-only-standard-library-import",  # TC003
    # `assert` is fine.
    "assert",  # S101
    # Shelling out is the job in some of these packages, not a smell: the
    # notifier drives `gh` and the changelog reads a `git log`. Both are
    # ignored across the team's repositories for the same reason.
    "suspicious-subprocess-import",  # S404
    "subprocess-without-shell-equals-true",  # S603
    # Magic methods and `__init__` do not need docstrings.
    "undocumented-magic-method",  # D105
    "undocumented-public-inits",  # D107
]

[tool.ruff.lint.pydocstyle]
# Our docstrings are Google-style, as they are in operator, charmlibs,
# jubilant and ops-harness, all of which say so here. Selecting all of `D`
# without saying so leaves the rules for the other conventions turned on:
# the contradictory `D203`/`D213` pairs, and `D413`, which wants a blank
# line before the closing quotes of a docstring that ends in a section.
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["D", "S101", "S105", "S106"]
